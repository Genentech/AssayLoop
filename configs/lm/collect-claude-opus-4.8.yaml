# Configuration for collecting Claude Opus 4.8 predictions.
#
# Provider is "anthropic": credentials come from the environment (.env),
# NOT this file:
#   ANTHROPIC_API_KEY=sk-ant-...   (https://console.anthropic.com/settings/keys)
#   ANTHROPIC_BASE_URL=...         (optional; only for an Anthropic-compatible gateway)
#
# Usage:
#   assayloop run  ... --acq llm_single --lm-config configs/lm/collect-claude-opus-4.8.yaml
#   assayloop sweep ... --acq llm_single --lm-config configs/lm/collect-claude-opus-4.8.yaml

defaults:
  - collect-predictions

model_name: "claude-opus-4.8"

lm:
  provider: "anthropic"
  model: "claude-opus-4-8"
  max_tokens: 64000
